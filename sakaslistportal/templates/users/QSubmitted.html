<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Query Submitted Confirmation</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <!-- <link rel="stylesheet" href="QSubmitted.css"> -->
    <style>
        :root {
            --primary-color: #38e07b;
            --vivid-azure: #00BFFF;
            --dark-azure: #0077B6;
            --bg-dark: #111827;
            --bg-gray: #1f2937;
            --text-light: #f9fafb;
            --text-gray: #9ca3af;
            --border-gray: #374151;
            }

        * {
            margin: 0;
            box-sizing: border-box;
            outline: 0;
            padding: 0;
            text-wrap: nowrap;
        }

        body {
            font-family: 'poppins', sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);

        }

        .container {
        justify-content: center;
        align-items: center;
        margin: 0 auto;
        text-align: center;
        border: #f9fafb 1px solid;
        padding: 30px;
        border-radius: 10px;
            width: fit-content;
        margin-top: 150px;
        word-break: break-word;
        }


        .container p { font-size: small; margin-bottom: 20px; }
        .query-details { display: flex; margin-top: 20px; justify-content: space-between;  }
        .response-time { display: flex; justify-content: space-between;}
        .response-time p { font-size: px; width: fit-content;}
        .response-time span { font-size: 13px;}

        .container button { padding: 10px; border-radius: 8px; width: 100%; }
        .container button:hover { background: var(--vivid-azure); color: var(--text-light); cursor: pointer; transition: 0.3s ease-in-out;  }
        .container hr { align-items: center; display: none;}

    </style>
</head>
<body>

    <div class="container">
        <i class="fa fa-check-circle" style="font-size: 64px; color: hsl(198, 92%, 55%); margin-bottom: 18px;"></i>
        <h1>Query Submitted Successfully!</h1>
        <p>Your query has been successfully submitted. Our team is reviewing it and we will get back to you shortly.</p>
        <hr>
        <div class="query-details">
            <p>Query ID</p>
            <span>#2321242</span>
        </div>
        <div class="response-time">
            <p>Estimated Response Time</p>
            <span>2-3 business days</span>
        </div>
        <div class="button">
            <button type="button" onclick="window.location.href='{% url 'submit_query' %}'">
                Submit Another Query
            </button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
