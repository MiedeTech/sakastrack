{% load static %}
<html>
<head>
  <meta charset="utf-8"/>
  <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect"/>
  <link as="style" href="https://fonts.googleapis.com/css2?display=swap&family=Manrope:wght@400;500;700;800&family=Noto+Sans:wght@400;500;700;900" onload="this.rel='stylesheet'" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
  <title>Stitch Design</title>
  <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon"/>

  <style>
    :root {
      --primary-color:#5078ee;
      --bg-dark: #111714;
      --bg-card: #1d2923;
    }

    body {
      margin: 0;
      background-color: var(--bg-dark);
      font-family: Manrope, "Noto Sans", sans-serif;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 40px;
      border-bottom: 1px solid #29382f;
      white-space: nowrap;
    }

    header h1 {
      font-size: 20px;
      font-weight: 700;
      color: white;
    }

    header svg {
      width: 24px;
      height: 24px;
      color: var(--primary-color);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Main */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 16px;
    }

    .card {
      max-width: 28rem;
      width: 100%;
      padding: 32px;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background-color: var(--bg-card);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px auto;
    }

    .icon-wrapper span {
      font-size: 48px;
      color: var(--primary-color);
    }

    h2 {
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 8px;
      color: white;
    }

    p {
      font-size: 14px;
      color: #9ca3af; /* Tailwind gray-400 */
      margin-bottom: 32px;
    }

    a.button {
      display: inline-block;
      width: 100%;
      border-radius: 8px;
      background-color: var(--primary-color);
      padding: 12px 24px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      color: #111714;
      transition: opacity 0.2s ease;
    }

    a.button:hover {
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="relative flex size-full min-h-screen flex-col">
    <header>
      <div class="header-left">
        <img src="{% static 'images/sakaslist_logo-removebg-preview.png' %}" 
            alt="Logo" 
            style="width: 50px; height: auto;">
        <h1>SakasTrack</h1>
      </div>
    </header>

    <main>
      <div class="card">
        <div class="icon-wrapper">
          <span class="material-symbols-outlined">check</span>
        </div>
        <h2>Registration Successful!</h2>
        <p>
          Welcome to SakasTrack! Your staff account has been successfully created. 
          You can now log in to manage user queries and provide support.
        </p>
        <a href="{% url 'staff_login' %}" class="button">Go to Login</a>
      </div>
    </main>
  </div>
</body>
</html>
